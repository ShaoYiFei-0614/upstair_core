  foot_lift_step_ratio: 1.4
  foot_lift_target: 0.08
  forward_overspeed: 1.0
  forward_track_window: 0.25
  forward_vel: 10.0
  hold_elev_frac: 0.3
  joint_limit: -0.5
  joint_vel: -2.0e-05
  lateral_range_floor: 0.15
  lateral_vel: 6.0
  leg_collision: -0.25
  orientation: -1.2
  overspeed_cap: 2.0
  overspeed_range: 0.45
  pitch_cap: 0.4
  pitch_posture: 0.0
  pitch_tol_flat: 0.14
  pitch_tol_per_m: 1.2
  probe_blocked_frac: 0.3
  probe_lift: 0.0
  probe_lift_target: 0.06
  stair_progress: 1200.0
  success: 500.0
  termination: -5000.0
  torque: -0.00015
  track_tail: 1.5
  yaw_range_floor: 0.3
  yaw_rate: 4.0
run:
  log_every: 20
  name: ablation_l1
  save_every: 50000
  seed: 0
