# Level 1：非对称 AC（critic 特权足端-地形接触，actor 53 维）
# 由 runs/crawl24 的 _env.json + .tmp/crawl24_config.yaml 还原（2026-10-19）
curriculum:
  command_vx:
  - 0.2
  - 0.6
  command_vy_max:
  - 0.0
  command_yaw_max:
  - 0.0
  heights_cm:
  - 15.0
  learning_rate:
  - 7.0e-05
  n_up: 8
  reward_overrides:
    foot_lift:
    - 1.8
    foot_lift_step_ratio:
    - 2.4
    forward_overspeed:
    - 1.0
    probe_lift:
    - 1.8
    yaw_rate:
    - 4.0
  timesteps:
  - 1200000
  tread: 0.3
env:
  action_mode: residual
  action_scale: 0.6
  command:
    vx: 0.45
  command_wander_std: 0.03
  command_wander_tau: 1.5
