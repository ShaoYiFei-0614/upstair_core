    vel_filter: true
    privileged_foot_contact: true
  terminate_min_height: 0.15
  yaw_rate_mode: legacy
  stair_guidance_under_hold: true
play:
  batch: ''
  episodes_eval: 100
  episodes_video: 10
  seed: 0
  stages: auto
  video_max_frames: 300
ppo:
  batch_size: 512
  clip_range: 0.2
  device: cpu
  ent_coef: 0.002
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.00015
  log_std_init: -2.0
  max_grad_norm: 1.0
  n_epochs: 5
  n_steps: 256
  net_arch:
  - 512
  - 256
  - 128
  norm_reward: true
  target_kl: 0.03
  vf_coef: 0.5
reward:
  action_rate: -0.02
  air_time: 0.6
  air_time_max: 0.6
  air_time_target: 0.3
  alive: 0.15
  base_height: -2.0
  body_collision: -1.2
  foot_hold: 0.0
  foot_lift: 0.9
