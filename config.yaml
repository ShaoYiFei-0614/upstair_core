# ===========================================================================
#  盲走楼梯 · 训练与播放配置
#
#  所有超参只在这里改，脚本只用它，不再从命令行输入。
#  train.py 只认 --run-name / --config；play.py 只认 --run / --mode / --config。
#  被注释掉的行表示「与代码默认值相同」，取消注释即可覆盖。
# ===========================================================================

# --- 运行 -----------------------------------------------------------------
run:
  name: course3              # 输出目录 runs/<name>/
  seed: 0
  # 每个阶段存一次 checkpoint 的间隔（步）；0 = 只在阶段末存
  save_every: 50000
  # 每多少步更新打印一次进度行
  log_every: 20


# --- 课程 -----------------------------------------------------------------
# 六级：平地（预热直走）→ 平地（小指令）→ 平地（全量程指令）→ 3 → 6 → 9 cm。
# 前三级故意**全留在平地**：指令跟踪与爬楼是两种能力，混在一起学时跟踪会被
# 爬楼的压力淹没（实测 250k 步平地单级也学不会，会横移的策略基本不转向）。
# 顺序即高度升序，不要打乱；同一高度出现多次时阶段名会自动变成
# flat / flat_2 / flat_3，checkpoint 不会互相覆盖。
curriculum:
  heights_cm: [0.0, 0.0, 0.0, 3.0, 6.0, 9.0]
  tread: 0.50                # 踏面 [m] —— 不要改，0.40/0.60 会让成功率掉一个量级
  n_up: 8                    # 每级台阶数
  # 每级的步数预算；必须与 heights_cm 等长
  timesteps: [100000, 250000, 250000, 250000, 250000, 250000]
  # 每级的学习率；台阶越高越小，免得把已学会的步态踢掉
  learning_rate: [1.5e-4, 1.5e-4, 1.2e-4, 1.0e-4, 8e-5, 6e-5]
  # 每级的横向 / 偏航指令上界（指令课程）；都必须与 heights_cm 等长。
  # 阶段边界上由 scripts/train.py 调 venv.env_method("set_commands", ...) 下发。
  # ⚠ 课程只能改**范围**，不能开关那 2 维观测 —— 观测维数在整条课程里必须恒定，
  # 否则 PPO 的网络与 RolloutBuffer 会对不上。
  command_vy_max: [0.0, 0.15, 0.35, 0.30, 0.35, 0.40]
  command_yaw_max: [0.0, 0.15, 0.50, 0.35, 0.55, 0.70]
  # 每级的定值前进指令 [m/s]；0 = 沿用 env.command.vx。前两级压低，先站稳再提速。
  command_vx: [0.45, 0.45, 0.45, 0.0, 0.0, 0.0]
  # 平地段专用的成功距离 [m]；0 = 沿用 env.flat_success_distance（3.0）。
  # 指令一放宽就会绕路，长判据会把成功拖成超时。
  flat_success_distance: [2.0, 2.0, 2.5, 0.0, 0.0, 0.0]
  # 每级的奖励覆盖（奖励课程）：叠在下面 reward: 段的基线值之上，由
  # scripts/train.py 在阶段边界调 venv.env_method("set_reward_overrides", ...)
  # 下发。两种写法：标量 = 每一级都用它；列表 = 必须与 heights_cm 等长。
  # 这里让「越高的台阶越鼓励抬腿与试抬」：低台阶不需要，高台阶缺的正是这个。
  reward_overrides:
    foot_lift: [0.9, 0.9, 0.9, 1.0, 1.2, 1.4]
    foot_lift_step_ratio: [1.4, 1.4, 1.5, 1.6, 1.8, 2.0]
    probe_lift: [0.0, 0.0, 0.4, 0.6, 0.9, 1.2]


# --- 环境 -----------------------------------------------------------------
env:
  n_envs: 8                  # 向量环境数；单进程 DummyVecEnv
  episode_length_s: 20.0
  action_scale: 0.30         # 残差动作上限 [rad]，策略的权限
  # 指令（外部控制器接口）。vx 是定值；vy/yaw 的范围由上面的指令课程按级放宽，
  # 每回合在 [-max, +max] 里采样。评估时可用 scripts/teleop.py 逐步写入。
  command:
    vx: 0.55                 # 前进速度指令 [m/s]
  # 摔倒判据：机身高度（base_z 减参照面）低于 terminate_min_height 就判摔倒。
  # 躯干碰撞体最低点在 0.118 m，所以 0.15 留了 3.2 cm 余量。
  # 注意：躯干「接触地形」本身**不再**终止回合（旧 terminate_contact_steps
  # 字段已删，那条规则实测从未生效且随时误杀），代价由 body_collision 逐步承担。
  terminate_min_height: 0.15
  gait_prior: true           # 在 trot 开环先验之上学残差。**别关**：关掉后六级全 0
                             # （原地站到超时，|a|≈0.09），见 train.md §3.6
  gait_file: artifacts/trot_stairs.json
  # 观测开关；history_len=1 时每帧 42 + 3 + 1 + 2 = 48 维，即观测总量 48 维。
  # （最后 2 维是横向 / 偏航指令 [vy, wz]，由下面的 command 段与指令课程给出。）
  # 48 维每一项都有真机出处（编码器 / IMU / 上一步动作 / 本体感觉估计 / 上层指令），
  # 加上一个标量任务参数 step_height。信息来源清单见 agent.md §8.6。
  obs:
    base_lin_vel_body: true
    # 必须 false，且**不能**改成 true：这一项是「机身相对正下方地形的高度」，
    # 含地形真值，会破坏盲走。改成 true 会直接抛 ValueError（ObsConfig.__post_init__）。
    base_height: false
    gait_phase: false
    step_height: true
    # 历史帧数。实测 1 帧（48 维）**不亏**：课程内每一级都不差、3cm/6cm
    # 还更好（92% vs 62%、22% vs 0%），课程外 3/5cm 都是 100%。50 Hz 下
    # 相邻帧几乎相同，10 帧绝大部分是冗余（10 帧 = 480 维）。见 train.md §3.6。
    history_len: 1


# --- 奖励 -----------------------------------------------------------------
# 权重与公式见 README.md §3.3，每个权重关掉哪个失败见 experience.md §2。
reward:
  # 前进
  forward_vel: 2.5           # 跟踪 vx 指令的高斯项
  forward_vel_sigma: 0.25    # 标准差（平方后作分母）；vx=0 时该项只有 +0.02/步
  # 横向 / 旋转指令跟踪。两项**求和**合成 reward_terms 里的一行 "command_follow"。
  # 指令范围全为 0 时该项恒为 0，所以「只学直走」的阶段奖励与旧版逐位一致。
  #
  # ⚠ 为什么是求和、以及为什么权重从 1.5/1.0 提到 4.0/3.0（experience.md §18）：
  # 取 max 时哪个方向误差小就只保留那一个，偏航项的梯度被整个丢掉 —— 实测
  # course3 的 flat_3 横向还有微弱相关（r=+0.661、斜率+0.028），偏航完全为 0
  # （r=−0.085、斜率−0.006）。提权重是因为前进项 2.5 一直盖过跟踪项，
  # 策略「不跟指令、拿满前进分」是更稳的局部最优。
  lateral_vel: 4.0           # 对 vy 指令的高斯跟踪峰值 [m/s 误差 0 时]
  lateral_vel_sigma: 0.25    # 标准差 [m/s]
  yaw_rate: 3.0              # 对 wz 指令的高斯跟踪峰值 [rad/s 误差 0 时]
  yaw_rate_sigma: 0.25       # 标准差 [rad/s]
  # 姿态与能耗
  orientation: -1.2          # roll² + pitch²
  torque: -1.5e-4            # Στ²
  # 抬脚
  foot_lift: 0.9
  foot_lift_target: 0.08     # 目标下限 [m]
  foot_lift_step_ratio: 1.4  # 有效目标 = max(target, ratio × 台阶高)
  # 被阻挡时的试探抬腿（基线为 0，靠 curriculum.reward_overrides 逐级打开）
  # 势函数塑形：只按「被阻挡期间最高摆动峰值又提高了多少」结算，总量有界、不可刷分。
  probe_lift: 0.0            # 抬高进展的权重
  probe_lift_target: 0.06    # 进展的起算线 [m]，取普通步态峰值带（0.06~0.12）的上沿
  probe_lift_ratio: 1.0      # 未使用，保留字段（曾按 ratio × 台阶高 取起算线）
  probe_lift_max: 12         # 未使用，保留字段
  probe_blocked_frac: 0.30   # 实测前进速度 < 该比例 × 指令速度 ⇒ 判定被阻挡
  # 支撑相 shaping
  base_height: -2.0
  joint_vel: -2.0e-5
  action_rate: -0.02
  joint_limit: -0.5
  air_time: 0.6
  air_time_target: 0.30
  air_time_max: 0.60
  # 推进与碰撞
  stair_progress: 3.0        # 只在本回合刷新「最高台阶」时一次性付，站桩拿不到
  body_collision: -1.2       # −4.0 时「贴着立面蹭」被罚得比站桩还狠，见 experience.md §13
  leg_collision: -0.25
  # 结局
  alive: 0.15
  success: 50.0
  termination: -15.0


# --- PPO ------------------------------------------------------------------
ppo:
  net_arch: [512, 256]
  n_steps: 256               # × n_envs = 每次更新的样本量（8 → 2048）
  batch_size: 512
  n_epochs: 5
  learning_rate: 1.5e-4      # 会被 curriculum.learning_rate 按级覆盖
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  vf_coef: 0.5
  max_grad_norm: 1.0
  target_kl: 0.03
  log_std_init: -2.0
  norm_reward: true          # 奖励归一化：温和的稳定器，不是解药
  device: cpu


# --- 播放 / 评估 ----------------------------------------------------------
# 渲染参数固定在这里，命令行不再暴露。
play:
  episodes_gif: 10           # 模式 1：连续渲染多少个回合
  episodes_eval: 100         # 模式 2：跑多少个回合统计成功率
  seed: 0
  camera: track              # 相机固定
  width: 960
  height: 540
  fps: 25
  scale: 2                   # GIF 编码前的整数缩小倍数
  # stage_height_cm: 5.0     # 取消注释可覆盖楼梯高度（0 = 平地），否则用权重自带的地形
