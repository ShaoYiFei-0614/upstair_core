# ===========================================================================
#  盲走楼梯 · 训练与播放配置
#
#  所有超参只在这里改，脚本只用它，不再从命令行输入。
#  train.py 只认 --run-name / --config；play.py 只认 --run / --mode / --config。
#  被注释掉的行表示「与代码默认值相同」，取消注释即可覆盖。
# ===========================================================================

# --- 运行 -----------------------------------------------------------------
run:
  name: course3              # 输出目录 runs/<name>/
  seed: 0
  # 每个阶段存一次 checkpoint 的间隔（步）；0 = 只在阶段末存
  save_every: 50000
  # 每多少步更新打印一次进度行
  log_every: 20


# --- 课程 -----------------------------------------------------------------
# 六级：平地（预热直走）→ 平地（小指令）→ 平地（全量程指令）→ 3 → 6 → 9 cm。
# 前三级故意**全留在平地**：指令跟踪与爬楼是两种能力，混在一起学时跟踪会被
# 爬楼的压力淹没（实测 250k 步平地单级也学不会，会横移的策略基本不转向）。
# 顺序即高度升序，不要打乱；同一高度出现多次时阶段名会自动变成
# flat / flat_2 / flat_3，checkpoint 不会互相覆盖。
curriculum:
  heights_cm: [0.0, 0.0, 0.0, 0.0, 3.0, 6.0, 9.0, 12.0, 15.0]
  tread: 0.50                # 踏面 [m] —— 不要改，0.40/0.60 会让成功率掉一个量级
  n_up: 8                    # 每级台阶数
  # 每级的步数预算；必须与 heights_cm 等长
  timesteps: [150000, 250000, 250000, 250000, 250000, 250000, 250000, 250000, 250000]
  # 每级的学习率；台阶越高越小，免得把已学会的步态踢掉。
  # 平地四级刻意给高值（3e-4）：实测 1.5e-4 下策略输出几乎不动（250k 步只挪 0.05），
  # 而平地任务简单、不怕大步；上台阶后转保守。
  learning_rate: [3.0e-4, 3.0e-4, 3.0e-4, 3.0e-4, 2.0e-4, 1.5e-4, 1.0e-4, 8.0e-5, 6.0e-5]
  # 每级的横向 / 偏航指令上界（指令课程）；都必须与 heights_cm 等长。
  # 阶段边界上由 scripts/train.py 调 kw_call(venv, "set_commands", ...) 下发。
  # ⚠ 课程只能改**范围**，不能开关那 3 维观测 —— 观测维数在整条课程里必须恒定，
  # 否则 PPO 的网络与 RolloutBuffer 会对不上。
  #
  # 第 1 级是**偏航专练**（vy_max=0、yaw=0.30）：偏航的作动权限在 hip 上，而
  # 「转向」在账面上必须压过「跑得快」才学得出来，所以这一级同时关掉超速惩罚、
  # 把 yaw_rate 权重提到 8.0（见 reward_overrides）。第 2 级才放开横向，
  # 避免两条新轴同时竞争梯度；第 3 级合并，第 4 级恢复超速惩罚并加大范围。
  # 依据：yaw_max=0 的级别里没有任何一项读 wz，策略会以 −0.608 rad/s 恒定自转
  # 并冻住（扫 wz ∈ [−0.6, +0.6] 七档，斜率 −0.0021）。
  command_vy_max: [0.0, 0.30, 0.30, 0.30, 0.30, 0.35, 0.40, 0.45, 0.50]
  command_yaw_max: [0.30, 0.25, 0.45, 0.55, 0.45, 0.55, 0.70, 0.80, 0.90]
  # 前向指令的**采样区间** [m/s]（两元素 = 所有级别共用一个范围；也可以写成
  # 与 heights_cm 等长的嵌套列表，每级给一对）。每一回合在区间内均匀采样。
  # 冲刺（超出指令）由 reward.forward_overspeed 额外扣分，不靠这里设上限。
  command_vx: [0.2, 0.6]
  # 每级的奖励覆盖（奖励课程）：叠在下面 reward: 段的基线值之上，由
  # scripts/train.py 在阶段边界调 venv.env_method("set_reward_overrides", ...)
  # 下发。两种写法：标量 = 每一级都用它；列表 = 必须与 heights_cm 等长。
  # 这里让「越高的台阶越鼓励抬腿与试抬」：低台阶不需要，高台阶缺的正是这个。
  reward_overrides:
    foot_lift: [0.9, 0.9, 0.9, 0.9, 1.0, 1.2, 1.4, 1.6, 1.8]
    foot_lift_step_ratio: [1.4, 1.4, 1.4, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4]
    probe_lift: [0.0, 0.0, 0.0, 0.4, 0.6, 0.9, 1.2, 1.5, 1.8]
    # 转向探索必然要加速，超速惩罚会惩罚它；前三级关掉、之后逐级恢复。
    forward_overspeed: [0.0, 0.0, 0.0, 0.3, 0.6, 1.0, 1.0, 1.0, 1.0]
    # 前三级提高偏航权重：让「转向」在账面上压过「跑得快」。
    yaw_rate: [8.0, 6.0, 6.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0]


# --- 环境 -----------------------------------------------------------------
env:
  n_envs: 8                  # 向量环境数；单进程 DummyVecEnv
  episode_length_s: 20.0
  action_scale: 0.60         # 残差动作上限 [rad]，策略的权限。**不能小于 0.60**：
                             # 速度参数化后先验的速度下沿是 0.70 m/s，要够到指令带
                             # 的低档（0.20~0.40）必须靠常值残差刹车，实测需要
                             # 0.42~0.53 rad 的偏置 ⇒ scale 0.30（上限 0.30 rad）
                             # 根本压不下来。见 experience.md §20.4。
  # 指令（外部控制器接口）。三轴的**采样范围**由上面的指令课程按级下发，每回合
  # 在范围内均匀采样。评估时可用 scripts/teleop.py 逐步写入当前值。
  command:
    vx: 0.45                 # vx 指令的范围为 0 时的回退定值 [m/s]
  # 摔倒判据：机身高度（base_z 减参照面）低于 terminate_min_height 就判摔倒。
  # 躯干碰撞体最低点在 0.118 m，所以 0.15 留了 3.2 cm 余量。
  # 注意：躯干「接触地形」本身**不再**终止回合（旧 terminate_contact_steps
  # 字段已删，那条规则实测从未生效且随时误杀），代价由 body_collision 逐步承担。
  terminate_min_height: 0.15
  gait_prior: true           # 在 trot 开环先验之上学残差。**别关**：关掉后六级全 0
                             # （原地站到超时，|a|≈0.09），见 train.md §3.6
  gait_file: artifacts/trot_stairs.json
  # 全局先验幅值缩放。**保持 1.0**：速度参数化（下面的 gait_speed_track）
  # 需要完整的行走支量程，而行走支的下沿正好在缩放 0.46 处。
  gait_amp_scale: 1.0
  # 速度参数化：先验的步幅幅值跟着当前指令缩放，先验自己去指令附近的速度，
  # 策略只剩平衡与微调。实测（.tmp/zz_prior_calib.py）行走支上
  #     v(s) = 2.4975·s − 0.4657
  # 而行走支下沿 s=0.46 ⇒ 先验最低只稳定走到 0.70 m/s，s∈[0.34,0.44] 全部摔倒。
  # 所以这条只是把「固定 0.79 m/s 的先验」换成「按指令落在 0.70~2.03 的先验」：
  # 指令 < 0.70 时先验仍走 0.70，那一段靠策略残差刹车，刹车需要
  # action_scale ≳ 0.60（见上面 env.action_scale 的注释）。
  gait_speed_track: true
  # 观测开关；history_len=1 时每帧 42 + 3 + 1 + 3 = 49 维（打开 vel_filter 则 51 维）。
  # （3 维是三轴速度指令 [vx, vy, wz]，由下面的 command 段与指令课程给出。）
  # 每一项都有真机出处（编码器 / IMU / 上一步动作 / 本体感觉估计 / 上层指令），
  # 加上一个标量任务参数 step_height。信息来源清单见 agent.md §8.6。
  obs:
    base_lin_vel_body: true
    # 必须 false，且**不能**改成 true：这一项是「机身相对正下方地形的高度」，
    # 含地形真值，会破坏盲走。改成 true 会直接抛 ValueError（ObsConfig.__post_init__）。
    base_height: false
    gait_phase: false
    step_height: true
    # 指令跟随读**滤波后**的横向速度 / 偏航角速度。必须打开：瞬时 yaw_rate 在小跑
    # 步态下 std 可达 0.37 rad/s，奖励和成功判据都会变成「在判步态相位」。这两个量
    # 同时进观测以保持马尔可夫性（奖励读的就是它们）。
    vel_filter: true
    # 历史帧数。实测 1 帧**不亏**：课程内每一级都不差、3cm/6cm 还更好
    # （92% vs 62%、22% vs 0%），课程外 3/5cm 都是 100%。50 Hz 下相邻帧几乎
    # 相同，10 帧绝大部分是冗余（10 帧 = 500 维）。见 train.md §3.6。
    history_len: 1


# --- 奖励 -----------------------------------------------------------------
# 权重与公式见 README.md §3.3，每个权重关掉哪个失败见 experience.md §2。
reward:
  # 前进
  # ⭐ 形状 = 线性死区，量程 = max(|vx|, 0.30)；vx=0 时原地不动拿满分、
  # 往前冲掉分。为什么必须这么改（旧的高斯写法在 vx=0 的课程级里
  # 完全不惩罚前进）见 robotdog/reward.py 第 1 节的注释与 experience.md §19。
  forward_vel: 10.0          # 对 vx 指令的线性死区跟踪
  # 冲刺（实测 vx 超出指令）额外扣分。线性死区在 |err| > 量程 之后梯度归零，
  # 于是「冲到 1.9 m/s」与「刚好等于指令」同分 —— 超速必须一路有价钱。
  forward_overspeed: 1.0     # 超速侧惩罚斜率（× forward_vel 量级）
  overspeed_range: 0.45      # 超速每 1 m/s 扣 forward_vel / overspeed_range 分
  overspeed_cap: 2.0         # 超速惩罚的倍率上界（× forward_vel）：无上界时平地
                             # 「先验 2.05 vs 指令 0.45」会把它压到 −27/步、回报 −65000，
                             # 价值函数学不动（实测 explained_variance −10~0）
  # 前进项的**绝对**误差窗口 [m/s]：|v − cmd| 超过它就把这一项扣光。
  # 必须是绝对量程、不能按指令大小归一化 —— 相对误差下指令带一窄，站着不动
  # 就几乎满分（无先验三臂全部收敛到常数输出，站桩 +4.93/步）。取值要低于
  # 最窄的指令带宽度，否则带内所有速度都满分、没有区分度。
  forward_track_window: 0.25
  # 死区**外侧**的线性尾项系数：|err| > 量程 之后线性死区恒为 0、梯度也恒为 0，
  # 「已经偏出量程」的状态就没有回头路（实测偏航误差 0.44 rad/s 而 yaw_max 只有
  # 0.15 时整项归零，策略 250k 步没收回来）。尾项必须是**单调递减**的线性项：
  # 早期的二次减项在 x > 1 之后先增后减，等于把误差往更大处推（实测策略稳定在
  # wz=-0.764 对指令 0，成功率被 tol_wz 一票否决）。
  track_tail: 1.5
  # 横向 / 旋转指令跟踪。两项**求和**合成 reward_terms 里的一行 "command_follow"。
  # 指令范围全为 0 时该项恒为 0，所以「只学直走」的阶段奖励与旧版逐位一致。
  #
  # ⚠ 为什么是求和、以及形状为何是线性死区（experience.md §18）：
  # 取 max 时哪个方向误差小就只保留那一个，偏航项的梯度被整个丢掉 —— 实测
  # course3 的 flat_3 横向还有微弱相关（r=+0.661、斜率+0.028），偏航完全为 0
  # （r=−0.085、斜率−0.006）。高斯核（σ 0.25 或 0.08）与二次型都试过，
  # 策略在两种形状下都停在原地：前者「抖动碰巧对上」就有分，后者梯度
  # -2W(v-cmd)/range² 每单位动作只有约 1.35 分。
  lateral_vel: 6.0           # 对 vy 指令的线性死区跟踪峰值
  yaw_rate: 4.0              # 对 wz 指令的线性死区跟踪峰值（wz=0 时带基线惩罚）
  yaw_range_floor: 0.30      # yaw_max=0 时归一化偏航误差的量程下限 [rad/s]
  # 姿态与能耗
  orientation: -1.2          # roll² + pitch²
  torque: -1.5e-4            # Στ²
  # 抬脚
  foot_lift: 0.9
  foot_lift_target: 0.08     # 目标下限 [m]
  foot_lift_step_ratio: 1.4  # 有效目标 = max(target, ratio × 台阶高)
  foot_lift_gate_speed: 0.25 # 摆动门控：足端三维速度达到该值才按比例给分 [m/s]
  # 被阻挡时的试探抬腿（基线为 0，靠 curriculum.reward_overrides 逐级打开）
  # 势函数塑形：只按「被阻挡期间最高摆动峰值又提高了多少」结算，总量有界、不可刷分。
  probe_lift: 0.0            # 抬高进展的权重
  probe_lift_target: 0.06    # 进展的起算线 [m]，取普通步态峰值带（0.06~0.12）的上沿
  probe_blocked_frac: 0.30   # 实测前进速度 < 该比例 × 指令速度 ⇒ 判定被阻挡
  # 支撑相 shaping
  base_height: -2.0
  joint_vel: -2.0e-5
  action_rate: -0.02
  joint_limit: -0.5
  air_time: 0.6
  air_time_target: 0.30
  air_time_max: 0.60
  # 推进与碰撞
  stair_progress: 3.0        # 只在本回合刷新「最高台阶」时一次性付，站桩拿不到
  body_collision: -1.2       # −4.0 时「贴着立面蹭」被罚得比站桩还狠，见 experience.md §13
  leg_collision: -0.25
  # 结局
  # ``termination`` 必须**远大于**单步奖励的动态范围 × 回合步数，否则「提前摔倒」
  # 会成为最优解：平地回合 1000 步、前进项最差 −10/步时，撑满一回合要损失约
  # −31000，而第 75 步摔倒只损失约 −600（实测，见 experience.md）。−15 只值 2 步，
  # 挡不住这个激励 —— 实测策略把摔倒率从 0% 训到 100%、平均步数从 1000 掉到 75。
  alive: 0.15
  success: 50.0
  termination: -5000.0


# --- PPO ------------------------------------------------------------------
ppo:
  net_arch: [512, 256]
  n_steps: 256               # × n_envs = 每次更新的样本量（8 → 2048）
  batch_size: 512
  n_epochs: 5
  learning_rate: 1.5e-4      # 会被 curriculum.learning_rate 按级覆盖
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  vf_coef: 0.5
  max_grad_norm: 1.0
  target_kl: 0.03
  log_std_init: -2.0
  norm_reward: true          # 奖励归一化：温和的稳定器，不是解药
  device: cpu


# --- 播放 / 评估 ----------------------------------------------------------
# 播放参数：只留「渲染哪些东西」的开关；相机 / 分辨率 / 帧率 / 缩放固定在
# scripts/play.py 的模块常量里（CAMERA_GIF / FRAME_WIDTH / FRAME_HEIGHT /
# GIF_FPS / GIF_SCALE），写在这里也没有人会去调。
play:
  episodes_gif: 10           # 模式 1：连续渲染多少个回合
  episodes_eval: 100         # 模式 2：跑多少个回合统计成功率
  seed: 0
  # 单个回合最多写进 GIF 多少帧。渲染帧是 960×540 的 uint8（一帧约 1.5 MB），
  # 而回合可能拖到 500 步以上；逐阶段累积不加限会 MemoryError（曾经真的崩过）。
  # 上限一到就按当前预算反算步幅、稀疏取帧 —— 宁可 GIF 短一点，也不能中途崩。
  gif_max_frames: 300
  # gif 模式渲染哪些**课程阶段**（地形 × 指令）。平地级与台阶级都会渲染：
  # 平地那几级是判断「跟不跟横向/偏航指令」的唯一画面证据。
  #   auto（缺省） = 运行目录里有 checkpoints/<阶段>_final.zip 时只渲染那些阶段，
  #                  否则渲染下面 curriculum 的全部级
  #   curriculum   = 强制渲染全部级
  #   [flat, flat_2, stair3cm] 或 [0, 0, 3] = 只渲染列出的阶段
  stages: auto
  # 这一批 GIF 的标签，用来把**不同批次训练**的产物分开：
  # 落在 runs/<run>/gifs/<batch>/<阶段>/<阶段>.gif；留空则直接落
  # runs/<run>/gifs/<阶段>/<阶段>.gif。也接受命令行 --batch 覆盖。
  batch: ""
  # stage_height_cm: 5.0     # 取消注释可覆盖楼梯高度（0 = 平地），否则用权重自带的地形
